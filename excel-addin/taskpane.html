<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EZ SFC</title>
  <link rel="stylesheet" href="taskpane.css">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script defer src="taskpane.js"></script>
</head>
<body>
  <header class="appHeader">
    <div>
      <div class="eyebrow">Excelアドイン</div>
      <h1>EZ SFC</h1>
    </div>
    <span id="officeBadge" class="badge">準備中</span>
  </header>

  <main>
    <section class="card compact">
      <div class="stepTitle"><span>1</span>SFCと挿入枠</div>
      <label class="fileButton" for="sfcFile">SFCファイルを選択</label>
      <input id="sfcFile" type="file" accept=".sfc,.sfz">
      <div id="fileName" class="subtle">ファイル未選択</div>
      <button id="readSelection" class="secondary" type="button">Excelの選択範囲を取得</button>
      <div id="selectionInfo" class="subtle">セル範囲を選択してください</div>
    </section>

    <section class="card compact">
      <div class="stepTitle"><span>2</span>基準座標と表示範囲</div>
      <div class="fieldGrid">
        <label>X座標（北方向・m）<input id="coordX" type="number" step="0.001" inputmode="decimal"></label>
        <label>Y座標（東方向・m）<input id="coordY" type="number" step="0.001" inputmode="decimal"></label>
        <label>表示幅（m）<input id="extentWidth" type="number" min="0.001" step="1" value="100"></label>
        <label>表示高さ（m）<input id="extentHeight" type="number" min="0.001" step="1" value="100"></label>
      </div>
      <div class="buttonRow">
        <button id="applyView" type="button">座標を中央に表示</button>
        <button id="resetCenter" class="secondary" type="button">中央へ戻す</button>
      </div>
    </section>

    <section class="previewCard" aria-label="SFC位置調整プレビュー">
      <div class="previewHead">
        <strong>位置調整</strong>
        <span>ドラッグ：移動　ホイール：拡大縮小</span>
      </div>
      <div id="previewStage" class="previewStage">
        <iframe id="viewerFrame" title="SFCプレビュー" src="viewer.html?excelPreview=1"></iframe>
      </div>
    </section>

    <section class="card actionCard">
      <label class="qualityLabel">出力品質
        <select id="outputDpi">
          <option value="200">標準（200 dpi）</option>
          <option value="300" selected>印刷用（300 dpi）</option>
          <option value="400">高精細（400 dpi）</option>
        </select>
      </label>
      <button id="insertImage" class="primaryAction" type="button">選択範囲へ挿入</button>
      <div id="status" class="status" role="status" aria-live="polite">SFCファイルを選択してください。</div>
    </section>
  </main>
</body>
</html>
