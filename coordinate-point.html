<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17365d">
  <title>座標地点情報</title>
  <style>
    :root{font-family:"Yu Gothic UI","Noto Sans JP",sans-serif;color:#172033;background:#eef3f8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
    main{width:min(100%,520px);background:#fff;border-radius:18px;box-shadow:0 12px 36px #17365d24;overflow:hidden}
    h1{margin:0;padding:20px 24px;background:#17365d;color:#fff;font-size:1.25rem}
    dl{margin:0;padding:8px 24px 2px}
    .row{padding:15px 0;border-bottom:1px solid #dbe4ee}
    dt{margin:0 0 5px;color:#52657a;font-size:.84rem;font-weight:700}
    dd{margin:0;font-size:1.08rem;font-weight:600;line-height:1.55;overflow-wrap:anywhere}
    .actions{padding:22px 24px 26px}
    a{display:block;text-align:center;padding:15px;border-radius:10px;background:#16783d;color:#fff;text-decoration:none;font-weight:700;font-size:1rem}
    a:focus-visible{outline:3px solid #f5b400;outline-offset:3px}
    #error{display:none;margin:24px;color:#a12720;line-height:1.7}
  </style>
</head>
<body>
  <main>
    <h1>座標地点情報</h1>
    <div id="content" hidden>
      <dl>
        <div class="row"><dt>点名</dt><dd id="point-name"></dd></div>
        <div class="row"><dt>X座標</dt><dd id="x-coordinate"></dd></div>
        <div class="row"><dt>Y座標</dt><dd id="y-coordinate"></dd></div>
        <div class="row"><dt>住所</dt><dd id="address"></dd></div>
      </dl>
      <div class="actions"><a id="map-link" rel="noopener">Googleマップで開く</a></div>
    </div>
    <p id="error">QRコードの地点情報を読み取れませんでした。ExcelでQRコードを作り直してください。</p>
  </main>
  <script>
    (() => {
      const showError = () => { document.querySelector("#error").style.display = "block"; };
      try {
        const encodedValue = new URLSearchParams(location.search).get("d") || location.hash.slice(1);
        const encoded = encodedValue.replace(/-/g, "+").replace(/_/g, "/");
        if (!encoded) return showError();
        const padded = encoded + "=".repeat((4 - encoded.length % 4) % 4);
        const bytes = Uint8Array.from(atob(padded), character => character.charCodeAt(0));
        const [name, x, y, address, latitude, longitude] = new TextDecoder().decode(bytes).split("\n");
        if (![name, x, y, address, latitude, longitude].every(value => value !== undefined)) return showError();
        document.querySelector("#point-name").textContent = name || "-";
        document.querySelector("#x-coordinate").textContent = x === "-" ? "-" : `${x} m`;
        document.querySelector("#y-coordinate").textContent = y === "-" ? "-" : `${y} m`;
        document.querySelector("#address").textContent = address || "-";
        const mapUrl = new URL("https://www.google.com/maps/search/");
        mapUrl.searchParams.set("api", "1");
        mapUrl.searchParams.set("query", `${latitude},${longitude}`);
        document.querySelector("#map-link").href = mapUrl.href;
        document.querySelector("#content").hidden = false;
      } catch {
        showError();
      }
    })();
  </script>
</body>
</html>
